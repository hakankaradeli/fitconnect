version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fitconnect-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-fitconnect_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-4172}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
