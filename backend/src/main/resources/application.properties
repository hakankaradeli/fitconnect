spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitconnect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4172}

# PostgreSQL Dialect (Auto-detect hatasını önlemek için sabitlendi)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=0

# Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SQL_DEBUG:false}
spring.jpa.properties.hibernate.format_sql=${SQL_DEBUG:false}

# Server Configuration
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=-1

# JWT Security Configuration
jwt.secret=${JWT_SECRET:fitconnect-super-secure-and-ultra-resilient-jwt-secret-key-2026-production-ready-key-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION_MS:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Rate Limiting Configuration (Bucket4j - Brute Force Protection)
rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
rate-limit.login.duration-minutes=${RATE_LIMIT_LOGIN_DURATION_MINUTES:1}
rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:5}
rate-limit.register.duration-minutes=${RATE_LIMIT_REGISTER_DURATION_MINUTES:1}

# CORS Configuration (Comma-separated trusted origin patterns)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,https://ptfitconnect.com,https://*.ptfitconnect.com,http://ptfitconnect.com,http://*.ptfitconnect.com,https://fitconnect.com,https://*.fitconnect.com,https://*.studionuz.com}

# Data Initializer Configuration (Development/Seeding only - Disabled by default in production)
app.init-data.enabled=${INIT_DATA_ENABLED:false}
app.init-data.admin-email=${INIT_DATA_ADMIN_EMAIL:admin@hkfitconnect.com}
app.init-data.admin-password=${INIT_DATA_ADMIN_PASSWORD:}
app.init-data.gym-name=${INIT_DATA_GYM_NAME:HK Fit Connect Studio}

